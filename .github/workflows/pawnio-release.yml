name: PawnIO 보안 수정 빌드

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86, ARM64EC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: 전체 기능 버전 빌드 및 하드웨어 래퍼 검사
        shell: powershell
        run: ./tools/build-release.ps1 -Platform '${{ matrix.platform }}'
      - name: 검증된 압축 파일과 해시 업로드
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-PawnIO-${{ matrix.platform }}
          path: .build/releases/*
          if-no-files-found: error

